name: Java 25

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java25:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - run: mvn verify
