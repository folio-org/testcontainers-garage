name: Java 25

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java25:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - run: mvn verify
